<script>

/* =====================================================================
  星穹战机 · 深空弹幕   ——  科技风竖版弹幕射击（单文件可玩原型）
  - 设计分辨率 720x1280，自动缩放适配 PC / 手机
  - 键盘（WASD/方向键）+ 触屏拖动操控
  - 自动开火；空格 = 能量爆发；Q/数字键切换武器

  运行方式：启动本地服务后访问 index.html，或直接用浏览器打开本文件。
===================================================================== */

const ovCanvas = document.createElement('canvas');
ovCanvas.width = PORTRAIT_W * PORTRAIT_SCALE;

/* ===================== 精灵图（图片贴图） ===================== */
const SPRITES = {};
const SPRITE_MAP = {
  player:  'assets/tanks/tank_4_02.png',
  scout:   'assets/tanks/tank_3_00.png',

  gunship: 'assets/tanks/tank_r_gunship.png',

  skin_orange:'assets/tanks/tank_4_04.png',
  skin_red:   'assets/tanks/tank_4_01.png',
  skin_new00: 'assets/tanks/tank_3_00.png',
  skin_new01: 'assets/tanks/tank_3_01.png',
  skin_new02: 'assets/tanks/tank_3_02.png',
  skin_new03: 'assets/tanks/tank_4_03.png',
  skin_new04: 'assets/tanks/tank_4_04.png',
  skin_new05: 'assets/tanks/tank_4_02.png',
};
function loadSprites(){
  for(const k in SPRITE_MAP){
    const im = new Image();
    im.src = SPRITE_MAP[k];
    SPRITES[k] = im;
  }
}
function spriteReady(k){ const im=SPRITES[k]; return !!im && im.complete && im.naturalWidth>0; }
function drawSprite(k, x, y, w, rot){
  const im = SPRITES[k];
  if(!spriteReady(k)) return false;
  const h = w * (im.naturalHeight / im.naturalWidth);
  ctx.save();
  ctx.translate(x, y);
  if(rot) ctx.rotate(rot);
  ctx.drawImage(im, -w/2, -h/2, w, h);
  ctx.restore();
  return true;
}

/* ===================== 标题贴图（笔刷+斜切风） ===================== */
const TITLES = {};
const TITLE_MAP = {
  '恭 喜 通 关 ！': 'clear',
  '新 纪 录 ！': 'record',
  '任 务 失 败': 'fail',
  '新手教程': 'tutorial',
};
function loadTitles(){
  for(const k in TITLE_MAP){
    const im = new Image();
    im.src = 'assets/titles/' + TITLE_MAP[k] + '_title.png';
    TITLES[TITLE_MAP[k]] = im;
  }
}
function titleReady(k){ const im=TITLES[k]; return !!im && im.complete && im.naturalWidth>0; }
function drawTitlePic(key, x, y, size, glow){
  const im = TITLES[key];
  if(!titleReady(key)) return false;
  const h = size*1.8;
  const w = h*(im.naturalWidth/im.naturalHeight);
  ctx.save();
  ctx.translate(x, y);
  ctx.drawImage(im, -w/2, -h/2, w, h);
  ctx.restore();
  return true;
}

const rand = (a,b)=>a+Math.random()*(b-a);
const randInt = (a,b)=>Math.floor(rand(a,b+1));
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const dist = (x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const angleTo = (x1,y1,x2,y2)=>Math.atan2(y2-y1,x2-x1);
const lerp = (a,b,t)=>a+(b-a)*t;

/* ===================== 画面缩放（高分屏适配） ===================== */
let scale = 1;
function resize(){
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  // 手机端强制竖屏，电脑端强制横屏（内容与窗口方向无关）
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '')
    || (navigator.maxTouchPoints>0 && availW < 1024);
  if(isMobile){
    W = PORTRAIT_W; H = PORTRAIT_H;                 // 竖屏 720x1280
  } else {
    W = 1280; H = clamp(Math.round(1280 * availH / availW), 720, 960);  // 横屏 1280xN
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  scale = Math.min(availW / W, availH / H);
  const stage = document.getElementById('stage');
  stage.style.width  = (W*scale)+'px';
  stage.style.height = (H*scale)+'px';
  canvas.style.width  = (W*scale)+'px';
  canvas.style.height = (H*scale)+'px';
  if(player){
    player.x = clamp(player.x, 24, Math.max(24, W-24));
    player.y = clamp(player.y, 40, Math.max(40, H-40));
  }
}
window.addEventListener('resize', resize);

/* 屏幕坐标 → 逻辑坐标 */
function toLogical(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return { x:(clientX - r.left)/r.width*W, y:(clientY - r.top)/r.height*H };
}

/* PC(横屏) 时用整屏绘制 UI，移动端(竖屏) 仍走居中竖版面板 */
const isLandscape = () => W > H;

/* ===================== 输入 ===================== */
const keys = {};
let pointer = { down:false, x:W/2, y:H*0.78 };
let lastTouch = null;
let fsRequested = false;   // 首次点击请求全屏

window.addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  onKeyPress(e.code);
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

canvas.addEventListener('pointerdown', e=>{
  ensureAudio();
  if(!fsRequested){ fsRequested = true; if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); }
  const p = toLogical(e.clientX, e.clientY);
  pointer.down = true; pointer.x = p.x; pointer.y = p.y;
  if(state==='tutorial'){ tutorialClick(p.x,p.y); return; }
  // 若点中爆发按钮则触发，否则正常操控
  if(burstButtonHit(p.x,p.y)){ player && tryBurst(); return; }
  if(state==='playing' && exitButtonHit(p.x,p.y)){ exitGame(); return; }
  if(state==='playing' && stopButtonHit(p.x,p.y)){ stopGame(); return; }
  onPointerStart();
});
canvas.addEventListener('pointermove', e=>{
  const p = toLogical(e.clientX, e.clientY);
  pointer.x = p.x; pointer.y = p.y;
});
window.addEventListener('pointerup', ()=>{ pointer.down=false; });
canvas.addEventListener('contextmenu', e=>e.preventDefault());

/* ===================== 简易音效（WebAudio 合成，失败不影响游戏） ===================== */
let audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(freq, dur, type, vol){
  if(!audioCtx) return;
  try{
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.value = vol || 0.08;
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
const sfx = {
  shoot:(w)=>beep(700 + Math.random()*200 + (w||0), 0.07, 'square', 0.03),
  hit:()=>beep(300, 0.06, 'sawtooth', 0.05),
  boom:()=>{ beep(120, 0.4, 'sawtooth', 0.12); beep(220,0.3,'square',0.06); },
  kill:()=>{ beep(360, 0.16, 'square', 0.1); setTimeout(()=>beep(540,0.18,'square',0.09),40); },
  pick:()=>beep(880, 0.12, 'sine', 0.08),
  burst:()=>{ beep(60, 0.6, 'sawtooth', 0.14); beep(500,0.4,'square',0.05); },
  hurt:()=>beep(180, 0.25, 'square', 0.1),
  boss:()=>{ beep(90, 0.8, 'sawtooth', 0.14); setTimeout(()=>beep(70,0.8,'sawtooth',0.12),200); },
  phase:()=>{ beep(420,0.25,'square',0.08); setTimeout(()=>beep(640,0.25,'square',0.08),120); },
};

/* ===================== 武器配置（积分可解锁） ===================== */
const WEAPONS = [
  { id:'pulse', name:'脉冲炮',   color:'#00e5ff', icon:'■', cost:0,   desc:'通用机炮，稳定连射，适合走位。' },

  { id:'ring',  name:'环形弹幕', color:'#c07bff', icon:'◎', cost:2600,desc:'全方位环形弹幕，清怪与防御兼备。' },

const SKINS = [
  { id:'default', name:'星穹',   sprite:'player',     cost:0,    color:'#00e5ff', desc:'初始座驾，均衡可靠的护卫舰。' },

  { id:'silver',  name:'银梭',   sprite:'skin_new01', cost:2600, color:'#8fd3ff', desc:'银灰巡航舰，修长舰身贯穿力强。' },
  { id:'viper',   name:'碧影',   sprite:'skin_new02', cost:3600, color:'#7bff8e', desc:'灰红重装，双绿等离子推进尾焰。' },
  { id:'crimson', name:'绯红',   sprite:'skin_new03', cost:3000, color:'#ff2d75', desc:'赤红制式机，高机动、火力凶猛。' },
  { id:'jade',    name:'翠羽',   sprite:'skin_new04', cost:4600, color:'#7ef9ff', desc:'灰绿重装甲，青蓝座舱，稳如磐石。' },
  { id:'amber',   name:'琥珀',   sprite:'skin_new05', cost:6000, color:'#ffb347', desc:'琥珀重装，双引擎爆发，坚不可摧。' },
];

/* ===================== 全局存档（积分 / 已购 / 装备） ===================== */
let meta = {
  points: 0,
  unlockedWeapons: [0],
  equippedWeapon: 0,
  unlockedSkins: ['default'],
  equippedSkin: 'default',

};

/* ===================== 关卡配置 ===================== */
const LEVEL_COUNT = 8;   // 关卡总数
const LEVEL_NAMES = ['前哨突袭','风暴封锁','星河走廊','铁壁要塞','熔岩重炮','奥丁之门','末路狂飙','终局决战'];

const ENEMY_DEFS = {
  scout:   { hp:1, speed:170, score:100, r:16, color:'#ff5aa0', shape:'tri', fire:null },
  fighter: { hp:3, speed:130, score:200, r:20, color:'#ff7b00', shape:'dia', fire:{pattern:'aimed', count:1, spread:0, rate:2.4, speed:280} },

/* ===================== 全局游戏对象 ===================== */
let stars = [];
let clouds = [];
let trail = [];
let scrollY = 0;
const SCROLL = 260;   // 世界向下滚动速度（px/s）

const ESCROLL = 70;   // 敌方车辙向上滚动速度（更小）

const SCORE_TIERS = [5000, 10000, 20000, 40000, 80000, 150000, 300000];
const COMBO_TIERS = [10, 20, 30, 50, 80, 120, 200];

const REC_NAME = { score:'最高得分', combo:'最高连击', kills:'击落数' };
let bestScore = 1000, bestComboRec = 5, bestKills = 10;  // 历史最佳（展示用）

/* ===================== 星空背景 ===================== */
function initStars(){
  stars = [];
  for(let i=0;i<130;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H,
      z:rand(0.3,1.5), r:rand(0.5,2.2),
      c: Math.random()<0.15 ? '#00e5ff' : (Math.random()<0.2 ? '#b026ff' : '#ffffff'),
    });
  }
}

/* ===================== 粒子 ===================== */
function spawnParticles(x,y,color,n,speed,life,size){
  for(let i=0;i<n;i++){
    const a = Math.random()*TAU, sp = rand(speed*0.3, speed);
    particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:rand(life*0.5,life), maxLife:life, color, size:rand(size*0.5,size) });
  }
}
function explosion(x,y,color,big){
  spawnParticles(x,y,color||'#ff7b00', big?60:24, big?700:380, big?1.0:0.6, big?6:3);
  if(big) spawnParticles(x,y,'#ffffff',18,800,0.4,3);
}

/* ===================== 玩家 ===================== */
function createPlayer(){
  return {
    x:W/2, y:H*0.78, lockY:H*0.78, r:16,
    hp:3, maxHp:3,
    shield:0, shieldMax:50,
    energy:0, energyMax:100,
    power:1, maxPower:5,
    weapon: isWeaponUnlocked(meta.equippedWeapon) ? meta.equippedWeapon : 0,
    fireCd:0,
    invuln:0,
    speed:400, backSpeed:250,
    vx:0, vy:0,
    bank:0, lastX:null,
  };
}

function resetGame(){
  player = createPlayer();
  playerBullets = []; enemyBullets = []; enemies = []; powerups = []; particles = []; boss = null;
  elapsed = 0; levelTimer = 0; level = 1; clearing=false; clearTimer=0; spawnTimer = 0; bossCount = 0;
  score = 0; combo = 0; bestCombo = 0; killCount = 0;
  shake = 0; message=''; banner=''; bannerTimer=0;
  trail = [];
  enemyTrail = [];
  scrollY = 0;
  resetRecordFlags();
  initStars();
}

function firePlayerWeapon(p, dt){
  p.fireCd -= dt;
  if(p.fireCd > 0) return;
  const w = WEAPONS[p.weapon];
  const lv = p.power;
  const x = p.x, y = p.y - 14;
  p.fireCd = 0.10;

  const add = (o)=>playerBullets.push(Object.assign({ home:false, pierce:false, ttl:2.2, r:5, kind:w.id },
    o, { color:o.color || w.color }));

  // 所有武器都只朝正前方（上方）直线发射，绝不散射/环形/追踪
  if(w.id === 'pulse'){
    const n = 1 + Math.floor((lv-1)/2);
    for(let i=0;i<n;i++){ const off=(i-(n-1)/2)*6; add({ x:x+off, y, vx:0, vy:-760, dmg:8+lv*2, r:5 }); }
    sfx.shoot(0);
  } else if(w.id === 'beam'){
    p.fireCd = 0.22;
    add({ x, y, vx:0, vy:-1300, dmg:16+lv*4, r:7, pierce:true, ttl:0.8 });
    sfx.shoot(1);
  } else if(w.id === 'shot'){
    const n = 4 + lv*2;
    for(let i=0;i<n;i++){ const off=(i-(n-1)/2)*4; add({ x:x+off, y, vx:0, vy:-620, dmg:6+lv, r:4, ttl:1.0 }); }
    sfx.shoot(2);
  } else if(w.id === 'homing'){
    p.fireCd = 0.26;
    const n = 1 + Math.floor((lv-1)/2);
    for(let i=0;i<n;i++){ const off=(i-(n-1)/2)*12; add({ x:x+off, y, vx:0, vy:-520, dmg:12+lv*2, r:6, ttl:2.2 }); }
    sfx.shoot(3);
  } else if(w.id === 'ring'){
    p.fireCd = 0.40;
    const n = 3 + lv;
    for(let i=0;i<n;i++){ const off=(i-(n-1)/2)*5; add({ x:x+off, y, vx:0, vy:-640, dmg:8+lv*2, r:5, ttl:1.2 }); }
    sfx.shoot(4);
  }
}


function burstButtonHit(x,y){
  // 右下角爆发按钮
  const bx = W-70, by = H-90;
  return dist(x,y,bx,by) < 46;
}
function tryBurst(){
  if(!player || state!=='playing') return;
  if(player.energy < player.energyMax){ message = '能量未满'; messageTimer = 0.8; return; }
  player.energy = 0;
  sfx.burst();
  shake = 18;
  spawnParticles(player.x, player.y, '#00e5ff', 80, 900, 1.2, 5);
  spawnParticles(player.x, player.y, '#ffffff', 40, 700, 0.8, 4);
  // 清除所有敌弹
  for(const b of enemyBullets) spawnParticles(b.x,b.y,'#00e5ff',2,260,0.4,3);
  enemyBullets = [];
  // 全场敌人与 Boss 受到重创
  for(const e of enemies){ damageEnemy(e, 200); }
  if(boss && boss.active){ damageEnemy(boss, 250); }
  combo += 5; addCombo(5);
}

function updatePlayer(p, dt){
  const slow = keys['ShiftLeft']||keys['ShiftRight'];
  const spd = p.speed * (slow?0.55:1);
  let mx=0;
  if(keys['KeyA']||keys['ArrowLeft']) mx-=1;
  if(keys['KeyD']||keys['ArrowRight']) mx+=1;
  if(mx){
    p.x += mx*spd*dt;
  }
  // 触屏 / 鼠标拖动跟随：仅水平移动，y 锁定在固定车道
  if(pointer.down){
    const t = { x: clamp(pointer.x,0,W), y: p.lockY };
    p.x = lerp(p.x, t.x, clamp(12*dt,0,1));
    p.y = t.y;
  }
  p.x = clamp(p.x, 24, W-24);
  p.y = p.lockY;
  // 坦克车辙：移动时留下一段轨迹
  if(!trail.length || Math.hypot(p.x-trail[trail.length-1].x, p.y-trail[trail.length-1].y) > 16){
    trail.push({ x:p.x, y:p.y - scrollY, age:0 });   // 记录世界坐标，随滚动下移
  }
  if(p.lastX!==null){ const dx=p.x-p.lastX; p.bank=lerp(p.bank, clamp(dx*0.12,-0.3,0.3), 0.12); }
  p.lastX = p.x;

  // 尾焰粒子
  if(Math.random()<0.6) particles.push({
    x:p.x+rand(-4,4), y:p.y+18, vx:rand(-20,20), vy:rand(120,220),
    life:rand(0.2,0.4), maxLife:0.4, color:'#00e5ff', size:rand(2,4)
  });

  p.invuln = Math.max(0, p.invuln-dt);
  firePlayerWeapon(p, dt);
  if(p.energy < p.energyMax) p.energy = Math.min(p.energyMax, p.energy + 8*dt);
}

function damagePlayer(dmg){
  const p = player;
  if(!p || state!=='playing' || p.invuln>0) return;
  p.invuln = 1.2;
  sfx.hurt();
  shake = 14;
  combo = 0;
  if(p.shield>0){
    p.shield = Math.max(0, p.shield - dmg);
    message='护盾受击'; messageTimer=0.6;
  } else {
    p.hp -= 1;
    spawnParticles(p.x,p.y,'#ff2d75',24,500,0.6,4);
    if(p.hp<=0){
      state = 'over';
      explosion(p.x,p.y,'#ff5aa0',true);
      sfx.boom();
      saveRecords();
    }
  }
}

/* ===================== 敌人生成与行为 ===================== */
function spawnEnemy(type, ox, oy, group){
  const def = ENEMY_DEFS[type];
  let x = ox!==undefined ? ox : rand(60, W-60);
  let y = oy!==undefined ? oy : -50;
  let mov = 'straight';
  if(!group){
    if(type==='dart'){ mov='diag'; if(ox===undefined) x = Math.random()<0.5 ? -30 : W+30; }
    if(type==='mine'){ mov='chase'; if(ox===undefined) x = rand(60,W-60); }
  } else {
    mov = 'straight';   // 编队成员整体直线移动，保持组内相对静止
  }
  const hpScale = 1 + (level-1)*0.14;
  const spScale = clamp(1 + (level-1)*0.15, 1, 2.3);   // 关卡越高，敌机飞得越快
  const weave = (!group && mov==='straight') && Math.random()<0.35;
  enemies.push({ type, ...def, hp: Math.round(def.hp*hpScale), speed: def.speed*spScale, x, y, mov, t:0, stopY:rand(90,300), fireT:rand(0.5,1.5), hitFlash:0,
    baseX:x, weave, wamp: weave?rand(45,140):0, wfreq: weave?rand(0.8,2.4):0 });
}

// 一队 3/4/5 辆同型号坦克，紧密贴合成一排
function spawnFormation(type, count){
  const def = ENEMY_DEFS[type];
  const gap = Math.max(30, def.r*2.6);
  const total = (count-1)*gap;
  const cx = rand(Math.max(W*0.20, total/2+40), Math.min(W*0.80, W-total/2-40));
  for(let i=0;i<count;i++){
    const x = cx - total/2 + i*gap;
    spawnEnemy(type, x, -50, true);
  }
}

function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    e.hitFlash = Math.max(0,e.hitFlash-dt);
    e.t += dt;
    // 移动
    if(e.mov==='straight'){ e.y += e.speed*dt; if(e.weave) e.x = clamp(e.baseX + Math.sin(e.t*e.wfreq)*e.wamp, 20, W-20); }
    else if(e.mov==='diag'){ e.x += e.speed*0.6*dt*(e.x<W/2?1:-1); e.y += e.speed*dt; }
    else if(e.mov==='chase'){
      const a = angleTo(e.x,e.y,player.x,player.y);
      e.x += Math.cos(a)*e.speed*dt; e.y += Math.sin(a)*e.speed*dt;
    } else if(e.mov==='enter'){ // shooter 进入后定点
      if(e.y < e.stopY) e.y += e.speed*dt; else e.mov='hold';
    } else if(e.mov==='hold'){ e.y += Math.sin(e.t*2)*10; if(e.weave) e.x = clamp(e.baseX + Math.sin(e.t*e.wfreq)*e.wamp, 20, W-20); }
    // 敌方车辙：记录一段（之后向上滚动、渐隐）
    if(!e._tx || Math.hypot(e.x-e._tx, e.y-e._ty) > 18){
      if(e._tx!==undefined) enemyTrail.push({ ax:e._tx, ay:e._ty, bx:e.x, by:e.y, age:0 });
      e._tx = e.x; e._ty = e.y;
      if(enemyTrail.length > 700) enemyTrail.splice(0, enemyTrail.length-700);
    }

    // 开火
    if(e.fire){
      e.fireT -= dt;
      if(e.fireT<=0){
        e.fireT = e.fire.rate;
        enemyShoot(e);
      }
    }
    // 移除出界
    if(e.y>H+80 || e.x<-80 || e.x>W+80) { enemies.splice(i,1); continue; }
    // 与玩家碰撞
    if(player && dist(e.x,e.y,player.x,player.y) < e.r+player.r){ player.shield=0; damagePlayer(1); }
  }
}

function enemyShoot(e){
  const f = e.fire;
  const sp = clamp(0.85 + (level-1)*0.05, 0.85, 1.15);   // 前期敌方弹速更慢
  const fast = Math.max(f.speed*sp, H*1.25);              // 提速：约 0.8s 穿过整屏
  for(let i=0;i<f.count;i++){
    let a;
    if(f.pattern==='aimed'){
      a = angleTo(e.x,e.y,player.x,player.y) + (i-(f.count-1)/2)*rad(f.spread);
      a = clamp(a, 0.05, Math.PI-0.05);   // 只向前（向下）发射，不回射
    }
    else if(f.pattern==='fan'){ a = Math.PI/2 + (i-(f.count-1)/2)*rad(f.spread); }
    enemyBullets.push({ x:e.x, y:e.y, vx:Math.cos(a)*fast, vy:Math.sin(a)*fast, r:5, color:'#ff5aa0' });
  }
  sfx.hit();
}
function rad(d){ return d*Math.PI/180; }

/* ===================== 子弹更新 ===================== */
function updatePlayerBullets(dt){
  for(let i=playerBullets.length-1;i>=0;i--){
    const b = playerBullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.ttl -= dt;
    if(b.home){
      let tgt=null,best=1e9;
      for(const e of enemies){ const d=dist(b.x,b.y,e.x,e.y); if(d<best){best=d;tgt=e;} }
      if(boss && boss.active){ const d=dist(b.x,b.y,boss.x,boss.y); if(d<best){best=d;tgt=boss;} }
      if(tgt){
        const a=angleTo(b.x,b.y,tgt.x,tgt.y), s=Math.hypot(b.vx,b.vy);
        b.vx=lerp(b.vx,Math.cos(a)*s,0.12); b.vy=lerp(b.vy,Math.sin(a)*s,0.12);
      }
    }
    if(b.x<-20||b.x>W+20||b.y<-30||b.y>H+30||b.ttl<=0){ playerBullets.splice(i,1); continue; }
    // 命中判定
    if(!b.dead){
      for(const e of enemies){
        if(!e.dead && dist(b.x,b.y,e.x,e.y) < e.r+b.r){
          hitEnemy(b,e); b.dead = b.pierce?false:true; break;
        }
      }
      if(!b.dead && boss && boss.active && dist(b.x,b.y,boss.x,boss.y) < boss.r+b.r){
        hitEnemy(b,boss); b.dead = b.pierce?false:true;
      }
    }
    if(b.dead) playerBullets.splice(i,1);
  }
}

function hitEnemy(b,e){
  e.hp -= b.dmg; e.hitFlash = 0.08;
  spawnParticles(b.x,b.y,'#7ef9ff',3,300,0.3,3);
  if(e === boss){ sfx.hit(); return; }   // Boss 生命由 updateBoss 统一结算（含过关）
  if(e.hp<=0 && !e.dead){ e.dead=true; onEnemyKilled(e); explosion(e.x,e.y,e.color||'#ff7b00', !!e.elite); }
  else sfx.hit();
}

function damageEnemy(e, dmg){
  if(e.hp<=0) return;
  e.hp -= dmg; e.hitFlash=0.1;
  if(e === boss) return;                 // Boss 由 updateBoss 结算死亡
  if(e.hp<=0){ e.dead=true; onEnemyKilled(e); explosion(e.x,e.y,e.color||'#ff7b00', !!e.elite); }
}

function onEnemyKilled(e){
  killCount++;
  addCombo();
  let sc = e.score || 100;
  score += Math.round(sc * (1 + combo*0.1));
  dropLoot(e);
  sfx.kill();
}

function updateEnemyBullets(dt){
  for(let i=enemyBullets.length-1;i>=0;i--){
    const b = enemyBullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.x<-20||b.x>W+20||b.y<-30||b.y>H+30){ enemyBullets.splice(i,1); continue; }
    if(player && dist(b.x,b.y,player.x,player.y) < b.r+player.r){
      damagePlayer(2); enemyBullets.splice(i,1); continue;
    }
  }
}

function addCombo(n){
  combo += (n||1);
  if(combo>bestCombo) bestCombo=combo;
}

/* ===================== 道具 ===================== */
function dropLoot(e){
  const r = Math.random();
  if(e.elite){
    powerups.push({ x:e.x,y:e.y, vy:120, r:16, type: Math.random()<0.5?'P':'weapon' });
    return;
  }
  if(r<0.40) powerups.push({ x:e.x,y:e.y, vy:120, r:12, type:'P' });
  else if(r<0.55) powerups.push({ x:e.x,y:e.y, vy:120, r:12, type:'shield' });
  else if(r<0.70) powerups.push({ x:e.x,y:e.y, vy:120, r:12, type:'energy' });
}
function updatePowerups(dt){
  for(let i=powerups.length-1;i>=0;i--){
    const pu = powerups[i];
    pu.y += pu.vy*dt;
    if(pu.y>H+40){ powerups.splice(i,1); continue; }
    if(player && dist(pu.x,pu.y,player.x,player.y) < pu.r+player.r){
      sfx.pick();
      if(pu.type==='P'){ player.power = Math.min(player.maxPower, player.power+1); message='火力强化'; }
      else if(pu.type==='shield'){ player.shield = Math.min(player.shieldMax, player.shield+25); message='护盾回复'; }
      else if(pu.type==='energy'){ player.energy = Math.min(player.energyMax, player.energy+40); message='能量+'; }
      else if(pu.type==='weapon'){ player.weapon = nextOwnedWeapon(player.weapon); message='武器切换：'+WEAPONS[player.weapon].name; }
      messageTimer = 0.9;
      spawnParticles(pu.x,pu.y,'#00e5ff',12,300,0.5,3);
      powerups.splice(i,1);
    }
  }
}

/* ===================== 波次生成 ===================== */
function updateSpawning(dt){
  elapsed += dt;
  if(state!=='playing') return;
  levelTimer += dt;
  // 常规刷兵（难度随关卡提升）
  if(!(boss&&boss.active)){
    spawnTimer -= dt;
    if(spawnTimer<=0){
      spawnTimer = Math.max(0.5, 2.0 - (level-1)*0.12);
      // 一波一个密集编队：3/4/5 辆同型号紧贴成排
      spawnFormation(pickEnemyType(level), randInt(3,5));
    }
    // 精英炮艇随关卡出现
    if(level>=2 && Math.random() < 0.004 + (level-1)*0.003){
      spawnEnemy('gunship');
    }
  }
  // 波次结束：第 2 关起出 Boss，第 1 关直接过关
  const waveDuration = level>=2 ? Math.min(88, 43 + (level-1)*5) : 36;   // Boss 出现更晚
  if(level>=2 && !boss && levelTimer>=waveDuration){
    spawnBoss();
  } else if(level===1 && levelTimer>=waveDuration){
    startLevelClear();
  }
}

function pickEnemyType(lv){
  const t = ['scout','scout','scout','fighter'];
  if(lv>=2) t.push('scout');
  if(lv>=3) t.push('dart','shooter');
  if(lv>=4) t.push('scout','dart','shooter','fighter');
  if(lv>=5) t.push('scout','scout','dart','shooter','fighter');
  return t[randInt(0,t.length-1)];
}

function startLevelClear(){
  state = 'clear';
  // 通关后解锁下一关（视为已通关本关）
  meta.unlockedLevel = Math.max(meta.unlockedLevel, Math.min(level+1, LEVEL_COUNT));
  saveMeta();
  enemies = []; enemyBullets = []; powerups = []; boss = null; playerBullets = [];
  sfx.phase();
  shake = 10;
  score += 10000;
  lastClearPoints = clearPoints();
  gainPoints(lastClearPoints);
  if(recList.length && player) player.energy = Math.min(player.energyMax, player.energy+30);
  spawnParticles(W/2,H*0.45,'#00e5ff',80,600,1.0,4);
}

function advanceLevel(){
  recList = [];
  level++;
  levelTimer = 0;
  spawnTimer = 0.5;
  state = 'playing';
  banner = '第 '+level+' 关';
  bannerTimer = 1.6;
  if(player){ player.shield = Math.min(player.shieldMax, player.shield+20); player.hp = player.maxHp; }
  sfx.phase();
}

function spawnBoss(){
  bossCount++;
  boss = {
    active:true, dead:false,
    x:W/2, y:170, r:88,
    phase:0, invuln:1.0, phaseFrac:1.0,
    hpArr:[1600+bossCount*500, 1000+bossCount*320, 650+bossCount*200],
    hp:0,
    color:'#ff2d75', color2:'#b026ff',
    fireT:0, spiralA:0, moveT:0, left:false, warnT:0, beamBullets:false,
    name:'星核·奥丁',
  };
  boss.hp = boss.hpArr.reduce((a,b)=>a+b,0);
  boss.maxHp = boss.hp;
  boss.phaseHp = boss.hpArr[0];
  state='playing';
  sfx.boss();
  banner='警  报'; bannerTimer=2.0;
  shake=16;
  spawnParticles(W/2,H*0.3,'#ff2d75',120,700,1.2,6);
}

function bossCurrentPhase(b){
  const frac = b.hp / b.maxHp;
  if(frac > 0.66) return 0;
  if(frac > 0.33) return 1;
  return 2;
}

function updateBoss(dt){
  const b = boss;
  if(!b) return;
  b.invuln = Math.max(0,b.invuln-dt);
  // 相位切换
  const np = bossCurrentPhase(b);
  if(np !== b.phase){
    b.phase = np;
    b.invuln = 0.7;
    sfx.phase();
    shake=16;
    spawnParticles(b.x,b.y,'#ffffff',80,800,0.9,5);
    enemyBullets=[]; // 清屏
    message='形态变化：'+['近卫','狂飙','终焉'][np]+'形态'; messageTimer=1.2;
    // Boss 释放保护装备（护盾），提高存活率
    for(let i=0;i<2;i++) powerups.push({ x:b.x+rand(-70,70), y:b.y+rand(-10,10), vy:120, r:16, type:'shield' });
    // 形态浮动位置下移
    b.y = 170 + np*30;
  }
  b.moveT += dt;
  // 随机左右移动：随机目标点 + 随机速度，忽快忽慢
  if(b.hopT===undefined) b.hopT = 0;
  if(b.targetX===undefined || b.hopT<=0 || Math.abs(b.x-b.targetX) < 16){
    b.targetX = rand(b.r*1.3, W - b.r*1.3);
    b.hopSpd  = rand(160, 780) * clamp(0.8 + (bossCount-1)*0.12, 0.8, 1.6);
    b.hopT    = rand(0.4, 1.2);
  }
  b.hopT -= dt;
  const bdir  = Math.sign(b.targetX - b.x);
  const bstep = b.hopSpd * dt;
  b.x = Math.abs(b.targetX - b.x) <= bstep ? b.targetX : b.x + bdir*bstep;
  b.x = clamp(b.x, b.r*1.2, W - b.r*1.2);
  // 开火
  bossFire(b, dt);
  if(b.hp<=0 && !b.dead){
    b.dead=true;
    explosion(b.x,b.y,'#fff',true);
    explosion(b.x,b.y,'#ff2d75',true);
    explosion(b.x,b.y,'#b026ff',true);
    shake=26;
    sfx.boom();
    score += 20000;
    killCount++;
    startLevelClear();
    spawnParticles(W/2,H*0.3,'#00e5ff',120,800,1.5,6);
  }
}

function bossFire(b, dt){
  b.fireT -= dt;
  const aim = angleTo(b.x,b.y,player.x,player.y);
  const dens = clamp(0.72 + (bossCount-1)*0.16, 0.72, 1.15);
  const bspd = H*1.25;                    // Boss 弹速：约 0.8s 穿过整屏
  // 精准锁定齐射：窄扇形、直奔玩家当前位置
  if(b.aimT===undefined) b.aimT = 0;
  b.aimT -= dt;
  if(b.aimT<=0){
    b.aimT = 1.0/(0.6+dens*0.4);
    const aimN = Math.max(1, Math.round((bossCount>=3?5:3)*dens));
    for(let i=0;i<aimN;i++){
      const a = aim + (i-(aimN-1)/2)*0.06;
      enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*bspd,vy:Math.sin(a)*bspd,r:6,color:'#ffd166'});
    }
    sfx.hit();
  }
  if(b.phase===0){
    if(b.fireT<=0){ b.fireT = 0.7/(0.6+dens*0.4);
      const n = Math.max(1, Math.round(9*dens));
      for(let i=0;i<n;i++){ const a=aim+(i-(n-1)/2)*0.16; enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*bspd,vy:Math.sin(a)*bspd,r:6,color:'#ff5aa0'}); }
      sfx.hit();
    }
    if(Math.random()<0.05*dens){ enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(aim)*bspd,vy:Math.sin(aim)*bspd,r:7,color:'#ff9a3c'}); }
  } else if(b.phase===1){
    b.spiralA += 0.5*(0.6+dens*0.4);
    if(Math.random()<0.9*dens){ const a=b.spiralA; enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*bspd,vy:Math.sin(a)*bspd,r:6,color:'#b026ff'}); }
    if(b.fireT<=0){ b.fireT = 0.9/(0.6+dens*0.4);
      const n=Math.max(1, Math.round(20*dens));
      for(let i=0;i<n;i++){ const a=(i/n)*TAU+b.moveT; enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*bspd,vy:Math.sin(a)*bspd,r:6,color:'#ff2d75'}); }
      sfx.hit();
    }
  } else {
    b.spiralA += 0.6*(0.6+dens*0.4);
    const n3=Math.max(1, Math.round(3*dens));
    for(let i=0;i<n3;i++){ const a=b.spiralA+i*2.09; enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*bspd,vy:Math.sin(a)*bspd,r:5,color:'#ff2d75'}); }
    if(b.fireT<=0){ b.fireT = 0.5/(0.6+dens*0.4);
      const a=aim; enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*bspd,vy:Math.sin(a)*bspd,r:8,color:'#ffd166'});
      sfx.hit();
    }
  }
}




/* ===================== 粒子更新 ===================== */
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const pt = particles[i];
    pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vx*=0.96; pt.vy*=0.96; pt.life-=dt;
    if(pt.life<=0) particles.splice(i,1);
  }
}

/* ===================== 渲染 ===================== */
function drawBackdrop(){
  // 实景草地+土地背景（平铺并向下滚动）
  if(bgImg.complete && bgImg.naturalWidth>0){
    const pat = ctx.createPattern(bgImg, 'repeat');
    ctx.save();
    ctx.translate(0, scrollY);
    ctx.fillStyle = pat;
    ctx.fillRect(0, -scrollY, W, H);
    ctx.restore();
  } else {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#a78a50'); g.addColorStop(1,'#8f7440');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
  // 轻微暗角，突出战场层次
  ctx.save();
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.30, W/2, H/2, Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.28)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  ctx.restore();
}
function grassPatch(cx,cy,rx,ry){
  ctx.save();
  ctx.fillStyle='#5e8f3c'; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,TAU); ctx.fill();
  ctx.fillStyle='#6fa24a'; ctx.beginPath(); ctx.ellipse(cx+rx*0.18,cy-ry*0.18,rx*0.66,ry*0.66,0,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(48,88,40,0.55)'; ctx.lineWidth=2;
  for(let i=0;i<12;i++){
    const a=rand(0,TAU), r=rand(0,Math.min(rx,ry))*0.9;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r*0.6;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+rand(-3,3), y-rand(6,13)); ctx.stroke();
  }
  ctx.restore();
}

function drawTrail(){
  if(trail.length < 2) return;
  ctx.save();
  ctx.lineCap='round';
  for(let i=1;i<trail.length;i++){
    const a=trail[i-1], b=trail[i];
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
    if(len<1) continue;
    const px=-dy/len, py=dx/len, half=9;
    const alpha = clamp(1 - a.age/4, 0, 1) * 0.55;
    const ay=a.y+scrollY, by=b.y+scrollY;
    ctx.strokeStyle='rgba(45,33,18,'+alpha.toFixed(3)+')';
    ctx.lineWidth=9;
    ctx.beginPath();
    ctx.moveTo(a.x+px*half, ay+py*half); ctx.lineTo(b.x+px*half, by+py*half);
    ctx.moveTo(a.x-px*half, ay-py*half); ctx.lineTo(b.x-px*half, by-py*half);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEnemyTrail(){
  if(!enemyTrail.length) return;
  ctx.save();
  ctx.lineCap='round';
  for(const s of enemyTrail){
    const dx=s.bx-s.ax, dy=s.by-s.ay, len=Math.hypot(dx,dy);
    if(len<1) continue;
    const px=-dy/len, py=dx/len, half=8;
    const alpha = clamp(1 - s.age/2.2, 0, 1) * 0.45;
    ctx.strokeStyle='rgba(38,30,20,'+alpha.toFixed(3)+')';
    ctx.lineWidth=8;
    ctx.beginPath();
    ctx.moveTo(s.ax+px*half, s.ay+py*half); ctx.lineTo(s.bx+px*half, s.by+py*half);
    ctx.moveTo(s.ax-px*half, s.ay-py*half); ctx.lineTo(s.bx-px*half, s.by-py*half);
    ctx.stroke();
  }
  ctx.restore();
}

function initClouds(){
  clouds = [];
  for(let i=0;i<9;i++){
    clouds.push({
      x: rand(0, W), y: rand(80, H-120),
      r: rand(30, 78), a: rand(0.35, 0.75),
      sp: rand(0.3, 1.2),
      color: 'rgba(255,255,255,0.9)',
    });
  }
}

function drawGlow(x,y,r,color,alpha){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha!==undefined?alpha:0.6;
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  ctx.restore();
}

function drawPlayerShield(p){
  if(!p || (p.shield||0) <= 0 || !p.shieldMax) return;
  const frac = clamp(p.shield/p.shieldMax, 0, 1);
  const R = p.r*2 + 2 + Math.sin(performance.now()/300)*1.5;
  ctx.save();
  ctx.translate(p.x, p.y);
  drawGlow(0, 0, R+6, '#00e5ff', 0.16*frac);
  ctx.strokeStyle='#00e5ff'; ctx.globalAlpha=0.5+0.4*frac; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.stroke();
  ctx.strokeStyle='#7ef9ff'; ctx.globalAlpha=0.3+0.3*frac; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(0,0,R+5,0,TAU); ctx.stroke();
  ctx.restore();
}

function drawPlayer(p){
  if(p.invuln>0 && Math.floor(p.invuln*20)%2===0) return;
  drawPlayerShield(p);
  const skin = currentSkin();
  const spKey = skin.sprite;
  if(spKey === 'player'){
    if(spriteReady('player')){
      drawGlow(p.x, p.y+2, 44, skin.color, 0.35);
      drawSprite('player', p.x, p.y, 62, p.bank||0);
      return;
    }
  } else if(spriteReady(spKey)){
    // 按目标高度缩放皮肤贴图，保证体型一致
    const im = SPRITES[spKey];
    const th = 58;
    const tw = th * (im.naturalWidth / im.naturalHeight);
    drawGlow(p.x, p.y+2, 44, skin.color, 0.35);
    drawSprite(spKey, p.x, p.y, tw, p.bank||0);
    return;
  }
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.bank||0);
  drawGlow(0,2,44,'#00e5ff',0.4);
  // 落影（参考图的软阴影）
  ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(3,6,18,26,0,0,TAU); ctx.fill(); ctx.restore();

  const body='#22364a', lite='#3f5c78', accent='#00e5ff', accent2='#ff2d75', glass='#7ef9ff';
  ctx.lineJoin='round';
  // 主翼（后掠翼）
  ctx.fillStyle=body; ctx.strokeStyle=lite; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(5,-10); ctx.lineTo(24,6); ctx.lineTo(20,11); ctx.lineTo(7,4); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-5,-10); ctx.lineTo(-24,6); ctx.lineTo(-20,11); ctx.lineTo(-7,4); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 翼尖燈
  ctx.fillStyle=accent2; ctx.fillRect(19,5,5,5); ctx.fillRect(-24,5,5,5);
  // 机身
  ctx.fillStyle=body; ctx.strokeStyle=lite; ctx.lineWidth=1.8;
  ctx.beginPath();
  ctx.moveTo(0,-30);
  ctx.quadraticCurveTo(5,-18,6,-4);
  ctx.lineTo(6,13);
  ctx.quadraticCurveTo(4,22,0,24);
  ctx.quadraticCurveTo(-4,22,-6,13);
  ctx.lineTo(-6,-4);
  ctx.quadraticCurveTo(-5,-18,0,-30);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 平尾（水平尾翼）
  ctx.fillStyle=body; ctx.strokeStyle=lite;
  ctx.beginPath(); ctx.moveTo(4,14); ctx.lineTo(16,20); ctx.lineTo(14,23); ctx.lineTo(3,18); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4,14); ctx.lineTo(-16,20); ctx.lineTo(-14,23); ctx.lineTo(-3,18); ctx.closePath(); ctx.fill(); ctx.stroke();
  // 垂尾中线
  ctx.strokeStyle=lite; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,16); ctx.lineTo(0,27); ctx.stroke();
  // 驾驶舱（玻璃座舱）
  const cg=ctx.createLinearGradient(0,-14,0,2);
  cg.addColorStop(0,'#ffffff'); cg.addColorStop(0.45,glass); cg.addColorStop(1,'#00a0c8');
  ctx.fillStyle=cg;
  ctx.beginPath();
  ctx.moveTo(0,-15);
  ctx.quadraticCurveTo(4.5,-11,4.5,-1);
  ctx.quadraticCurveTo(2,3,0,3);
  ctx.quadraticCurveTo(-2,3,-4.5,-1);
  ctx.quadraticCurveTo(-4.5,-11,0,-15);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1; ctx.stroke();
  // 机头雷达
  ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(0,-27,2,0,TAU); ctx.fill();
  // 面板细节线
  ctx.strokeStyle='rgba(124,249,255,0.28)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,-23); ctx.lineTo(0,-16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5,-7); ctx.lineTo(5,-7); ctx.stroke();
  // 翼上装饰条
  ctx.strokeStyle=accent; ctx.lineWidth=1.6; ctx.globalAlpha=0.9;
  ctx.beginPath(); ctx.moveTo(7,-6); ctx.lineTo(21,6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-7,-6); ctx.lineTo(-21,6); ctx.stroke();
  ctx.globalAlpha=1;
  // 发动机尾焰
  ctx.globalCompositeOperation='lighter';
  const fg=ctx.createLinearGradient(0,19,0,31);
  fg.addColorStop(0,'rgba(0,229,255,0.95)'); fg.addColorStop(1,'rgba(0,229,255,0)');
  ctx.fillStyle=fg;
  ctx.beginPath(); ctx.moveTo(-3.5,19); ctx.lineTo(0,31); ctx.lineTo(3.5,19); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawEnemy(e){
  if(e.type && spriteReady(e.type)){
    drawGlow(e.x, e.y, e.r*1.6, e.color, 0.22);
    drawSprite(e.type, e.x, e.y+6, e.r*2.4, Math.PI);
    return;
  }
  if(!e.type){
    ctx.save(); ctx.translate(e.x,e.y); ctx.fillStyle=e.color;
    ctx.beginPath(); ctx.arc(0,0,e.r,0,TAU); ctx.fill(); ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(e.x,e.y);
  if(e.type==='mine'){ drawMine(e); ctx.restore(); return; }
  const r=e.r, col=e.color, body='#15202d';
  // 软阴影
  ctx.save(); ctx.globalAlpha=0.28; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(3,5,r*1.15,r*1.2,0,0,TAU); ctx.fill(); ctx.restore();
  // 高亮 / 辉光
  if(e.hitFlash>0){ ctx.shadowBlur=16; ctx.shadowColor='#ffffff'; }
  else { ctx.shadowBlur=8; ctx.shadowColor=col; }
  ctx.lineJoin='round';
  // 各类型机型轮廓（机头朝下，指向玩家）
  let pts;
  if(e.type==='scout') pts=[[0,r*1.35],[r*0.42,r*0.6],[r*1.3,r*0.02],[r*0.72,-r*0.6],[0,-r*0.78]];
  else if(e.type==='fighter') pts=[[0,r*1.4],[r*0.30,r*0.85],[r*0.52,r*0.22],[r*1.45,r*0.42],[r*1.0,r*0.06],[r*0.5,-r*0.08],[r*0.62,-r*0.7],[r*1.0,-r*0.9],[r*0.34,-r*1.12],[0,-r*1.22]];
  else if(e.type==='dart') pts=[[0,r*1.55],[r*0.32,r*0.55],[r*1.1,r*0.0],[r*0.62,-r*0.5],[0,-r*0.6]];
  else if(e.type==='shooter') pts=[[0,r*1.2],[r*0.4,r*0.55],[r*1.7,r*0.36],[r*1.55,r*0.02],[r*0.55,-r*0.28],[r*0.55,-r*0.9],[0,-r*1.02]];
  else if(e.type==='gunship') pts=[[0,r*0.95],[r*0.42,r*0.5],[r*1.85,r*0.34],[r*1.7,r*0.04],[r*0.6,-r*0.24],[r*0.6,-r*0.88],[r*1.0,-r*0.98],[r*0.3,-r*1.18],[0,-r*1.22]];
  else pts=[[0,r*1.2],[r*0.4,r*0.4],[r*1.15,r*0.1],[r*0.55,-r*0.5],[0,-r*0.8]];
  const full = pts.concat(pts.slice(1,-1).reverse().map(p=>[-p[0],p[1]]));
  ctx.beginPath();
  for(let i=0;i<full.length;i++){ const p=full[i]; i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }
  ctx.closePath(); ctx.fillStyle=body; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.stroke();
  ctx.shadowBlur=0;
  // 座舱玻璃
  if(e.type!=='dart'){
    ctx.fillStyle='#bfe9ff'; ctx.globalAlpha=0.9;
    ctx.beginPath(); ctx.ellipse(0,r*0.42,r*0.24,r*0.5,0,0,TAU); ctx.fill();
    ctx.globalAlpha=1;
  }
  // 机翼装饰线
  ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.globalAlpha=0.85;
  ctx.beginPath(); ctx.moveTo(r*0.3,r*0.28); ctx.lineTo(r*1.0,r*0.16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r*0.3,r*0.28); ctx.lineTo(-r*1.0,r*0.16); ctx.stroke();
  ctx.globalAlpha=1;
  // 尾部引擎辉光
  ctx.globalCompositeOperation='lighter';
  drawGlow(0,-r*1.05,r*0.5,col,0.5);
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}
function drawMine(e){
  const r=e.r, col=e.color, body='#2a1a0a';
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.save(); ctx.globalAlpha=0.28; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(3,4,r,r,0,0,TAU); ctx.fill(); ctx.restore();
  // 尖刺
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.shadowColor=col; ctx.shadowBlur=6;
  ctx.beginPath();
  for(let i=0;i<8;i++){ const a=i/8*TAU; ctx.moveTo(Math.cos(a)*r*0.4,Math.sin(a)*r*0.4); ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
  ctx.stroke();
  // 核心
  ctx.fillStyle=body; ctx.beginPath(); ctx.arc(0,0,r*0.45,0,TAU); ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke();
  // 警示灯
  ctx.fillStyle='#ffd166'; ctx.shadowColor='#ffd166'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(0,0,r*0.16,0,TAU); ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

function drawBullet(b){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  drawGlow(b.x,b.y,b.r*2.4,b.color||'#7ef9ff',0.85);
  const c = b.color || '#7ef9ff';
  if(b.kind==='pulse'){
    ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(b.x,b.y,b.r*0.6,b.r*1.4,0,0,TAU); ctx.fill();
  } else if(b.kind==='beam'){
    ctx.fillStyle=c; ctx.fillRect(b.x-2.5,b.y-16,5,32);
  } else if(b.kind==='shot'){
    ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(b.x,b.y-b.r*1.6); ctx.lineTo(b.x+b.r,b.y+b.r*0.9); ctx.lineTo(b.x-b.r,b.y+b.r*0.9); ctx.closePath(); ctx.fill();
  } else if(b.kind==='ring'){
    ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(b.x,b.y-b.r*1.3); ctx.lineTo(b.x+b.r*1.1,b.y); ctx.lineTo(b.x,b.y+b.r*1.3); ctx.lineTo(b.x-b.r*1.1,b.y); ctx.closePath(); ctx.fill();
  } else if(b.kind==='homing'){
    drawMissileBullet(b,c);
  } else {
    ctx.fillStyle=c; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*0.85,0,TAU); ctx.fill();
  }
  ctx.restore();
}
function drawMissileBullet(b,c){
  ctx.save();
  ctx.translate(b.x,b.y);
  const ang = Math.atan2(b.vy||0, b.vx||0);
  ctx.rotate(ang);
  ctx.fillStyle='#eef8ff';
  ctx.beginPath();
  ctx.moveTo(b.r*2.2,0); ctx.lineTo(b.r*0.9,b.r*0.85); ctx.lineTo(-b.r*1.1,b.r*0.85);
  ctx.lineTo(-b.r*1.1,-b.r*0.85); ctx.lineTo(b.r*0.9,-b.r*0.85); ctx.closePath(); ctx.fill();
  ctx.fillStyle=c;
  ctx.beginPath(); ctx.moveTo(-b.r*1.1,0); ctx.lineTo(-b.r*2.4,b.r*0.5); ctx.lineTo(-b.r*2.4,-b.r*0.5); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPowerup(pu){
  ctx.save();
  const colT = { P:'#00e5ff', shield:'#3f8cff', energy:'#ffd166', weapon:'#c07bff' };
  const col = colT[pu.type] || '#00e5ff';
  const r = pu.r || 16;
  drawGlow(pu.x,pu.y,r*2,col,0.5);
  ctx.translate(pu.x,pu.y);
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.fillStyle=col+'44';
  ctx.beginPath();
  if(pu.type==='P'){
    // 向上的三角（火力）
    ctx.moveTo(0,-r*1.05); ctx.lineTo(r,r*0.62); ctx.lineTo(-r,r*0.62);
  } else if(pu.type==='shield'){
    // 盾牌
    ctx.moveTo(0,-r*1.05);
    ctx.quadraticCurveTo(r*1.0,-r*0.95, r*0.9,-r*0.05);
    ctx.quadraticCurveTo(r*0.78,r*0.8, 0,r*1.1);
    ctx.quadraticCurveTo(-r*0.78,r*0.8,-r*0.9,-r*0.05);
    ctx.quadraticCurveTo(-r*1.0,-r*0.95,0,-r*1.05);
  } else if(pu.type==='energy'){
    // 菱形（能量碎片）
    ctx.moveTo(0,-r*1.05); ctx.lineTo(r*0.7,0); ctx.lineTo(0,r*1.05); ctx.lineTo(-r*0.7,0);
  } else {
    // 四角星（武器）
    for(let i=0;i<8;i++){ const a=i*TAU/8-Math.PI/2; const rr=(i%2===0)?r*1.05:r*0.45; if(i===0)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); }
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 字母（带深色描边，保证亮天下也清晰）
  const label = pu.type==='P'?'P':(pu.type==='shield'?'S':(pu.type==='energy'?'E':'W'));
  ctx.font='bold 15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(8,40,80,0.9)'; ctx.fillText(label,1.2,2.2);
  ctx.fillStyle='#ffffff'; ctx.fillText(label,0,1);
  ctx.restore();
}

function drawBoss(b){
  if(spriteReady('boss')){
    drawGlow(b.x, b.y, 150, b.color, 0.4);
    drawSprite('boss', b.x, b.y+8, 250, Math.PI);
  } else {
    ctx.save();
    ctx.translate(b.x,b.y);
    drawGlow(0,0,120,b.color,0.5);
    ctx.shadowBlur=24; ctx.shadowColor=b.color2;
    ctx.strokeStyle=b.color; ctx.fillStyle=b.color2+'33'; ctx.lineWidth=3;
    ctx.beginPath();
    for(let i=0;i<12;i++){ const a=i/12*TAU-Math.PI/2; const r=b.r*(i%2?0.85:1); if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
    ctx.closePath(); ctx.fill(); ctx.stroke();
    drawGlow(0,0,34,'#ffffff',0.8);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,10,0,TAU); ctx.fill();
    ctx.restore();
  }
  // Boss 血条
  const bw=W-160, bx=80, by=24;
  ctx.fillStyle='rgba(255,45,117,0.15)'; ctx.fillRect(bx,by,bw,12);
  ctx.fillStyle='#ff2d75'; ctx.fillRect(bx,by,bw*clamp(b.hp/b.maxHp,0,1),12);
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,12);
  ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  ctx.fillText('星核·奥丁  ' + ['Ⅰ','Ⅱ','Ⅲ'][b.phase], W/2, by-6);
}

function drawHUD(p){
  ctx.save();
  const cTxt='rgba(8,40,80,0.9)';
  ctx.textAlign='left'; ctx.font='bold 14px sans-serif';
  ctx.fillStyle=cTxt; ctx.fillText('第 '+level+' 关', 24, 30);
  // 生命
  ctx.fillStyle=cTxt; ctx.fillText('生命',24,52);
  for(let i=0;i<p.maxHp;i++){ ctx.fillStyle=i<p.hp?'#0a9fd8':'rgba(8,40,80,0.25)'; ctx.beginPath(); ctx.arc(24+i*22,68,7,0,TAU); ctx.fill(); }
  // 护盾
  ctx.fillStyle=cTxt; ctx.fillText('护盾',24,92);
  bar(24,100,140,10, p.shield/p.shieldMax, '#1d9fd8');
  // 能量
  ctx.fillStyle=cTxt; ctx.fillText('能量',24,126);
  bar(24,134,140,10, p.energy/p.energyMax, '#f2a51f');
  // 武器 + 火力
  ctx.fillStyle=cTxt; ctx.fillText('武器',W-24-120,52);
  ctx.textAlign='right'; ctx.fillStyle=WEAPONS[p.weapon].color; ctx.font='bold 15px sans-serif';
  ctx.fillText(WEAPONS[p.weapon].name, W-24, 74);
  ctx.font='12px sans-serif'; ctx.fillStyle=cTxt;
  ctx.fillText('火力 Lv.'+p.power, W-24, 94);
  // 得分 + 连击
  ctx.textAlign='center'; ctx.font='bold 22px sans-serif'; ctx.fillStyle='#083a66';
  ctx.fillText(score.toLocaleString(), W/2, 60);
  if(combo>1){ ctx.font='bold 20px sans-serif'; ctx.fillStyle='rgba(214,120,10,'+clamp(combo*0.05,0.3,1)+')'; ctx.fillText('×'+(1+combo*0.1).toFixed(1)+'  '+combo+' 连击', W/2, 92); }
  // 信息提示
  if(messageTimer>0 && message){
    ctx.font='bold 16px sans-serif'; ctx.fillStyle='#083a66'; ctx.globalAlpha=clamp(messageTimer,0,1);
    ctx.fillText(message, W/2, H-120);
  }
  // 爆发按钮（右下）
  const bx=W-70,by=H-90;
  const full = p.energy>=p.energyMax;
  ctx.globalCompositeOperation='lighter';
  drawGlow(bx,by,44, full?'#0a9fd8':'rgba(8,58,102,0.35)', full?0.8:0.25);
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle = full?'#0a9fd8':'rgba(8,58,102,0.5)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(bx,by,36,0,TAU); ctx.stroke();
  ctx.fillStyle='#083a66'; ctx.textAlign='center'; ctx.font='bold 15px sans-serif';
  ctx.fillText('爆', bx, by+5);
  ctx.restore();

  function bar(x,y,w,h,frac,color){
    frac=clamp(frac,0,1);

/* ===================== 竖排版面居中合成（横屏下菜单/教程不变形） ===================== */
function plateRect(){
  const cw = W, ch = H;
  const fit = Math.min(1, (cw*0.985)/(PORTRAIT_W*PORTRAIT_SCALE), (ch*0.985)/(PORTRAIT_H*PORTRAIT_SCALE));
  const dw = PORTRAIT_W*PORTRAIT_SCALE*fit;
  const dh = PORTRAIT_H*PORTRAIT_SCALE*fit;
  return { dx:(cw-dw)/2, dy:(ch-dh)/2, dw, dh };
}
function toPlate(x, y){
  const r = plateRect();
  return { x:(x-r.dx)/r.dw*PORTRAIT_W, y:(y-r.dy)/r.dh*PORTRAIT_H };
}
function overlay(drawFn){
  const cc = ctx, cw = W, ch = H;
  ctx = ovCtx;
  W = PORTRAIT_W; H = PORTRAIT_H;
  ovCtx.setTransform(PORTRAIT_SCALE, 0, 0, PORTRAIT_SCALE, 0, 0);
  ovCtx.clearRect(0, 0, PORTRAIT_W, PORTRAIT_H);
  drawFn();
  ctx = cc; W = cw; H = ch;
  const r = plateRect();
  ctx.drawImage(ovCanvas, r.dx, r.dy, r.dw, r.dh);
}

function drawShopPreview(it, entry, cx, cy, size){
  ctx.save();
  ctx.translate(cx, cy);
  const color = it.type==='skin' ? SKINS[it.index].color : WEAPONS[it.index].color;
  if(it.type==='skin'){
    const sk = SKINS[it.index];
    if(spriteReady(sk.sprite)){
      const im = SPRITES[sk.sprite];
      const th = size, tw = th*(im.naturalWidth/im.naturalHeight);
      drawGlow(0,0,size*0.85, color, 0.4);
      ctx.drawImage(im, -tw/2, -th/2, tw, th);
      ctx.restore();
      return;
    }
  }
  drawGlow(0,0,size*0.85, color, 0.4);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0,-size*0.5); ctx.lineTo(size*0.5,0);
  ctx.lineTo(0,size*0.5); ctx.lineTo(-size*0.5,0);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function shopAction(it){
  const list = shopTab==='weapon' ? WEAPONS : SKINS;
  const entry = list[it.index];
  if(it.state==='buy'){
    if(meta.points >= entry.cost){
      meta.points -= entry.cost;
      if(it.type==='weapon') meta.unlockedWeapons.push(it.index);
      else meta.unlockedSkins.push(it.key);
      saveMeta();
      shopMsg = '兑换成功：'+entry.name; shopMsgTimer = 1.4; sfx.pick();
    } else {
      shopMsg = '积分不足'; shopMsgTimer = 1.4; sfx.hurt();
    }
  } else if(it.state==='equip'){
    if(it.type==='weapon') meta.equippedWeapon = it.index;
    else meta.equippedSkin = it.key;
    saveMeta();
    shopMsg = '已装备：'+entry.name; shopMsgTimer = 1.4; sfx.pick();
  }
}

/* ===================== 主循环 ===================== */
let lastTime = performance.now();
function loop(now){
  let dt = (now - lastTime)/1000; lastTime = now;
  dt = Math.min(dt, 0.05);
  scrollY += SCROLL*dt;   // 背景与车辙一起向下滚动
  if(shopMsgTimer>0) shopMsgTimer -= dt;
  if(state==='playing'){
    updateSpawning(dt);
    updatePlayer(player, dt);
    updateEnemies(dt);
    updatePlayerBullets(dt);
    updateEnemyBullets(dt);
    updatePowerups(dt);
    updateBoss(dt);
    updateParticles(dt);
    for(let i=trail.length-1;i>=0;i--){ trail[i].age += dt; if(trail[i].age > 4 || (trail[i].y+scrollY) > H+60) trail.splice(i,1); }
    for(let i=enemyTrail.length-1;i>=0;i--){ const s=enemyTrail[i]; s.age+=dt; s.ay-=ESCROLL*dt; s.by-=ESCROLL*dt; if(s.age>2.2 || (s.ay<-40 && s.by<-40)) enemyTrail.splice(i,1); }
    if(enemies.length){ for(let i=enemies.length-1;i>=0;i--){ if(enemies[i].dead) enemies.splice(i,1); } }
    if(boss && boss.dead) boss=null;
    if(messageTimer>0) messageTimer-=dt;
    if(bannerTimer>0) bannerTimer-=dt;
    checkRecords();
  } else if(state==='over' || state==='menu' || state==='tutorial' || state==='clear' || state==='shop' || state==='levelselect'){
    updateParticles(dt);
    if(bannerTimer>0) bannerTimer-=dt;
  }
  // 屏幕震动
  shake = Math.max(0, shake - dt*40);
  const sx = (Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.save();
  ctx.translate(sx,sy);

  drawBackdrop();
  if(state==='playing'||state==='over') drawTrail();
  if(state==='playing'||state==='over') drawEnemyTrail();
  if(player && (state==='playing'||state==='over')) drawPlayer(player);
  for(const e of enemies) if(!e.dead) drawEnemy(e);
  for(const b of playerBullets) drawBullet(b);
  for(const b of enemyBullets) drawBullet(b);
  for(const pu of powerups) drawPowerup(pu);
  if(boss && boss.active && !boss.dead) drawBoss(boss);
  drawParticles();
  if(player && (state==='playing'||state==='over')) drawHUD(player);
  if(state==='playing') drawTopStatus();
  if(state==='menu'||state==='pause'||state==='over'){
    if(isLandscape()) drawOverlay(); else overlay(drawOverlay);
  }
  if(state==='tutorial'){ if(isLandscape()) drawTutorial(); else overlay(drawTutorial); }
  if(state==='clear'){ if(isLandscape()) drawClear(); else overlay(drawClear); }
  if(state==='shop'){ if(isLandscape()) drawShop(); else overlay(drawShop); }
  if(state==='levelselect'){ if(isLandscape()) drawLevelSelect(); else overlay(drawLevelSelect); }
  ctx.restore();

  requestAnimationFrame(loop);
}

/* ===================== 状态与交互 ===================== */
function startGame(lv){
  resetGame();
  if(lv && lv>=1){
    level = Math.min(lv, LEVEL_COUNT);
    bossCount = Math.max(0, level-2);   // 直接选择关卡时保持该关 Boss 强度一致
    banner = '第 '+level+' 关'; bannerTimer = 1.6;
  }
  state='playing';
  ensureAudio();
}

function loadRecords(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem('pilotwar_records') || 'null'); }catch(e){}
  if(d){
    bestScore  = d.score || 0;
    bestComboRec = d.combo || 0;
    bestKills  = d.kills || 0;
  } else {
    bestScore = 1000; bestComboRec = 5; bestKills = 10;
  }
}
function saveRecords(){
  bestScore  = Math.max(bestScore,  score);
  bestComboRec = Math.max(bestComboRec, bestCombo);
  bestKills  = Math.max(bestKills,  killCount);
  try{ localStorage.setItem('pilotwar_records', JSON.stringify({score:bestScore, combo:bestComboRec, kills:bestKills})); }catch(e){}
}

/* ===================== 积分 / 商店 存档 ===================== */
let shopTab = 'weapon';        // 'weapon' | 'skin'
let shopMsg = '';              // 商店内临时提示（积分不足等）
let shopMsgTimer = 0;
let lastClearPoints = 0;       // 最近一次过关获得的积分（用于通关页展示）
let shopReturn = 'menu';       // 从哪个界面进入商店，返回时回到该界面

function loadMeta(){
  let m = null;
  try{ m = JSON.parse(localStorage.getItem('pilotwar_meta') || 'null'); }catch(e){}
  if(m && typeof m==='object'){
    meta.points = Math.max(0, m.points|0);
    meta.unlockedWeapons = Array.isArray(m.unlockedWeapons)
      ? m.unlockedWeapons.filter(i=>Number.isInteger(i) && i>=0 && i<WEAPONS.length).slice(0, WEAPONS.length)
      : [0];
    if(!meta.unlockedWeapons.includes(0)) meta.unlockedWeapons.push(0);
    meta.equippedWeapon = meta.unlockedWeapons.includes(m.equippedWeapon) ? m.equippedWeapon : 0;
    meta.unlockedSkins = Array.isArray(m.unlockedSkins)
      ? m.unlockedSkins.filter(id=>SKINS.some(s=>s.id===id)).slice(0, SKINS.length)
      : ['default'];
    if(!meta.unlockedSkins.includes('default')) meta.unlockedSkins.unshift('default');
    meta.equippedSkin = meta.unlockedSkins.includes(m.equippedSkin) ? m.equippedSkin : 'default';
    meta.tutorialDone = !!m.tutorialDone;
    meta.unlockedLevel = Number.isFinite(m.unlockedLevel) ? clamp(Math.floor(m.unlockedLevel), 1, LEVEL_COUNT) : 1;
  }
}
function markTutorialDone(){ if(!meta.tutorialDone){ meta.tutorialDone = true; saveMeta(); } }
function saveMeta(){
  try{ localStorage.setItem('pilotwar_meta', JSON.stringify(meta)); }catch(e){}
}
function isWeaponUnlocked(i){ return meta.unlockedWeapons.includes(i); }
function isSkinUnlocked(id){ return meta.unlockedSkins.includes(id); }
function ownedWeapons(){ return WEAPONS.map((_,i)=>i).filter(i=>isWeaponUnlocked(i)); }
function nextOwnedWeapon(i){
  const list = ownedWeapons();
  if(!list.length) return 0;
  const p = list.indexOf(i);
  return list[(p+1) % list.length];
}
function trySelectWeapon(i){
  if(isWeaponUnlocked(i)){
    player.weapon = i;
    message = '武器切换：'+WEAPONS[i].name;
    messageTimer = 0.9;
  } else {
    message = '未解锁，到商店兑换';
    messageTimer = 1.1;
  }
}
function currentSkin(){ return SKINS.find(s=>s.id===meta.equippedSkin) || SKINS[0]; }
function gainPoints(n){ meta.points += Math.max(0, Math.floor(n)); saveMeta(); }

// 过关积分奖励：关卡越高、本关得分越多，奖励越丰厚
function clearPoints(){
  return 200 + level*120 + Math.min(800, Math.floor(score/100));
}

function openShop(from){ shopReturn = from || 'menu'; shopTab='weapon'; shopMsg=''; shopMsgTimer=0; state='shop'; ensureAudio(); }
function closeShop(){ state = shopReturn || 'menu'; }
function resetRecordFlags(){ scoreTi=-1; comboTi=-1; killsTi=-1; recList=[]; }
function tierIndex(v, tiers){ let idx=-1; for(let i=0;i<tiers.length;i++){ if(v>=tiers[i]) idx=i; } return idx; }
function checkRecords(){
  if(state!=='playing') return;
  const mk = (name, val, tiers, idx)=>{
    if(idx < 0) return null;
    const milestone = tiers[idx];
    const next = idx+1 < tiers.length ? tiers[idx+1] : null;
    return { name, milestone, value:val, next, remain: next!==null ? next-val : 0 };
  };
  const sIdx = tierIndex(score, SCORE_TIERS);
  const cIdx = tierIndex(bestCombo, COMBO_TIERS);
  const kIdx = tierIndex(killCount, KILLS_TIERS);
  if(sIdx > scoreTi){ scoreTi = sIdx; const e=mk(REC_NAME.score, score, SCORE_TIERS, sIdx); if(e) recList.push(e); }
  if(cIdx > comboTi){ comboTi = cIdx; const e=mk(REC_NAME.combo, bestCombo, COMBO_TIERS, cIdx); if(e) recList.push(e); }
  if(kIdx > killsTi){ killsTi = kIdx; const e=mk(REC_NAME.kills, killCount, KILLS_TIERS, kIdx); if(e) recList.push(e); }
}

// 失败后从当前关重新挑战（不退回第 1 关）
function restartLevel(){
  const keepPower = player ? player.power : 1;
  const keepWeapon = player ? player.weapon : 0;
  player = createPlayer();
  player.power = Math.min(keepPower, player.maxPower);
  player.weapon = keepWeapon;
  playerBullets=[]; enemyBullets=[]; enemies=[]; powerups=[]; particles=[]; boss=null;
  elapsed=0; levelTimer=0; spawnTimer=0;
  bossCount = Math.max(0, level-2);   // 保持该关 Boss 强度与首次一致
  score=0; combo=0; bestCombo=0; killCount=0;
  message=''; messageTimer=0; banner='第 '+level+' 关'; bannerTimer=1.6;
  state='playing';
  trail = [];
  enemyTrail = [];
  scrollY = 0;
  resetRecordFlags();
  initStars();
  ensureAudio();
}
function onPointerStart(){
  if(state==='menu'){
    const q = isLandscape() ? {x:pointer.x, y:pointer.y} : toPlate(pointer.x, pointer.y);
    const mb = menuButtons();
    if(inRect(q, mb.start)) openLevelSelect();
    else if(inRect(q, mb.shop)) openShop();
    else if(inRect(q, mb.tut)) enterTutorial();
    return;
  }
  if(state==='levelselect'){
    const q = isLandscape() ? {x:pointer.x, y:pointer.y} : toPlate(pointer.x, pointer.y);
    const B = levelButtons();
    if(inRect(q, B.back)){ state='menu'; return; }
    for(const c of B.cards){
      if(inRect(q, c)){
        if(c.locked) sfx.hurt();
        else startGame(c.index);
        return;
      }
    }
    return;
  }
  if(state==='shop'){
    const q = isLandscape() ? {x:pointer.x, y:pointer.y} : toPlate(pointer.x, pointer.y);
    const B = shopButtons();
    if(inRect(q, B.back)){ closeShop(); return; }
    if(inRect(q, B.weapon)){ shopTab='weapon'; return; }
    if(inRect(q, B.skin)){ shopTab='skin'; return; }
    for(const it of B.items){ if(inRect(q, it.act)){ shopAction(it); return; } }
    return;
  }
  if(state==='over'){
    const q = isLandscape() ? {x:pointer.x,y:pointer.y} : toPlate(pointer.x,pointer.y);
    const eg = endGameButtons();
    if(inRect(q, eg.level)) openLevelSelect();
    else if(inRect(q, eg.shop)) openShop('over');
    else restartLevel();
    return;
  }
  if(state==='pause'){ state='playing'; return; }
  if(state==='clear'){
    const q = isLandscape() ? {x:pointer.x,y:pointer.y} : toPlate(pointer.x,pointer.y);
    const eg = endGameButtons();
    if(inRect(q, eg.level)) openLevelSelect();
    else if(inRect(q, eg.shop)) openShop('clear');
    else if(level>=LEVEL_COUNT) openLevelSelect();
    else advanceLevel();
    return;
  }
}
function onKeyPress(code){
  ensureAudio();
  if(state==='menu'){
    if(code==='Space'||code==='Enter') openLevelSelect();
    return;
  }
  if(state==='levelselect'){
    if(code==='Escape'||code==='Backspace'||code==='KeyB'||code==='KeyM') state='menu';
    else if(code==='Space'||code==='Enter'){ if(meta.unlockedLevel>=1) startGame(1); }
    return;
  }
  if(state==='tutorial'){
    if(code==='Space'||code==='Enter'||code==='ArrowRight') tutorialAdvance(1);
    else if(code==='ArrowLeft') tutorialAdvance(-1);
    return;
  }
  if(state==='shop'){
    if(code==='Escape'||code==='Backspace'||code==='KeyB'||code==='KeyM') closeShop();
    if(code==='ArrowLeft'||code==='KeyA') shopTab='weapon';
    if(code==='ArrowRight'||code==='KeyD') shopTab='skin';
    return;
  }
  if(state==='playing'){
    if(code==='Space') tryBurst();
    if(code==='KeyP'||code==='Escape') state='pause';
    if(code==='KeyQ'){ player.weapon=nextOwnedWeapon(player.weapon); message='武器切换：'+WEAPONS[player.weapon].name; messageTimer=0.9; }
    if(code==='Digit1'){ trySelectWeapon(0); }
    if(code==='Digit2'){ trySelectWeapon(1); }
    if(code==='Digit3'){ trySelectWeapon(2); }
    if(code==='Digit4'){ trySelectWeapon(3); }
    if(code==='Digit5'){ trySelectWeapon(4); }
    return;
  }
  if(state==='pause'){
    if(code==='KeyP'||code==='Escape') state='playing';
    return;
  }
  if(state==='clear'){
    if(code==='Space'||code==='Enter'){ if(level>=LEVEL_COUNT) openLevelSelect(); else advanceLevel(); }
    return;
  }
  if(state==='over'){
    if(code==='Space'||code==='Enter') restartLevel();
    return;
  }
}

function init(){
  resize();
  initStars();
  initClouds();

  loadTitles();
  loadRecords();
  loadMeta();
  // 注册 Service Worker（需在 http/https 下），离线可玩、支持安装为客户端
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  // 打开即自动进入新手教程（最开始的引导）
  enterTutorial();
  requestAnimationFrame(loop);
}
init();
</script>
</body>
